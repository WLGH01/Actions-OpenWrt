name: OpenWrt Builder

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool make ninja-build p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync \
            scons squashfs-tools subversion swig texinfo unzip vim wget \
            xsltproc zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir
          df -hT

      - name: Clone ImmortalWrt
        run: |
          rm -rf "$GITHUB_WORKSPACE/openwrt"
          git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" "$GITHUB_WORKSPACE/openwrt"

      - name: Load and update feeds
        run: |
          cp "$FEEDS_CONF" openwrt/feeds.conf.default
          chmod +x diy-part1.sh diy-part2.sh
          cd openwrt
          "$GITHUB_WORKSPACE/diy-part1.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig
          "$GITHUB_WORKSPACE/diy-part2.sh"
          grep -q '^CONFIG_TARGET_x86_64_DEVICE_generic=y' .config || { echo 'x86_64 generic target is required'; exit 1; }
          if grep -q '^CONFIG_PACKAGE_luci-app-daed=y' .config; then
            grep -q '^CONFIG_PACKAGE_daed=y' .config || { echo 'luci-app-daed is enabled but daed is missing'; exit 1; }
          fi
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_(luci-app-daed|daed|vmlinux-btf))' .config | head -60

      - name: Download sources with retries
        working-directory: /workdir/openwrt
        run: |
          for attempt in 1 2 3; do
            if make download -j2; then
              break
            fi
            echo "Download attempt $attempt failed; retrying..."
            sleep 15
            if [ "$attempt" = 3 ]; then
              echo "Source download failed after 3 attempts."
              exit 1
            fi
          done
          find dl -size -1024c -type f -print -delete
          test -z "$(find dl -size -1024c -type f -print -quit)"

      - name: Compile firmware
        id: compile
        working-directory: /workdir/openwrt
        run: |
          set -o pipefail
          threads="$(nproc)"
          if [ "$threads" -gt 2 ]; then
            threads=$((threads - 2))
          else
            threads=1
          fi
          echo "Using $threads build threads ($(nproc) CPU cores minus 2)"
          if make -j"$threads" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"; then
            :
          else
            echo 'Parallel build failed; retrying single-threaded. Detailed output is in build.log.'
            if ! make -j1 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"; then
              echo 'Single-threaded build failed.'
              exit 1
            fi
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          if [ -s DEVICE_NAME ]; then echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"; fi
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Organize firmware
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        if: steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Publish release
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FILE_DATE }}
          generate_release_notes: true
          files: ${{ env.FIRMWARE }}/*

      - name: Cleanup build workspace
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/openwrt" /workdir/openwrt
