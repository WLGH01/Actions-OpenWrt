name: 自定义 OpenWrt 固件编译

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: OpenWrt source repository URL
        required: true
        default: https://github.com/immortalwrt/immortalwrt
      repo_branch:
        description: Source branch
        required: true
        default: openwrt-24.10
      config_file:
        description: Repository config file
        required: true
        default: .config
      feeds_file:
        description: Repository feeds file
        required: true
        default: feeds.conf.default
      upload_release:
        description: Publish firmware to a GitHub Release
        required: true
        type: boolean
        default: false
      build_jobs:
        description: Build jobs; leave empty to use logical CPUs minus 2
        required: false
        default: ""
      rootfs_size:
        description: Root filesystem size in MiB
        required: true
        default: "5120"

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: 检出仓库配置
        uses: actions/checkout@v4

      - name: 准备编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            help2man intltool libc6-dev-i386 libelf-dev libfuse-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool make ninja-build p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync \
            scons squashfs-tools subversion swig texinfo unzip vim wget \
            xsltproc zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir

      - name: 获取并更新源码
        working-directory: /workdir
        env:
          REPO_URL: ${{ inputs.repo_url }}
          REPO_BRANCH: ${{ inputs.repo_branch }}
        run: |
          if [ -d /workdir/openwrt/.git ]; then
            cd /workdir/openwrt
            git remote set-url origin "$REPO_URL"
            git fetch --depth=1 origin "$REPO_BRANCH"
            git checkout -B "$REPO_BRANCH" "origin/$REPO_BRANCH"
            git reset --hard "origin/$REPO_BRANCH"
            # 保留 build_dir、staging_dir、dl 等编译缓存，不执行 git clean -fdx。
          elif [ -e /workdir/openwrt ]; then
            rm -rf /workdir/openwrt
            git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" /workdir/openwrt
          else
            git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" /workdir/openwrt
          fi
          rm -rf "$GITHUB_WORKSPACE/openwrt"
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: 更新并安装软件源
        env:
          FEEDS_FILE: ${{ inputs.feeds_file }}
        run: |
          test -s "$FEEDS_FILE"
          cp "$FEEDS_FILE" openwrt/feeds.conf.default
          chmod +x diy-part1.sh diy-part2.sh
          cd openwrt
          "$GITHUB_WORKSPACE/diy-part1.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用自定义配置
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
        run: |
          test -s "$CONFIG_FILE"
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          case "${{ inputs.rootfs_size }}" in (*[!0-9]*|0) echo 'Invalid rootfs_size'; exit 1;; esac
          sed -i "s/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=${{ inputs.rootfs_size }}/" .config
          make defconfig
          "$GITHUB_WORKSPACE/diy-part2.sh"
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_(luci-app-daed|daed))' .config | head -60

      - name: 下载软件包源码
        working-directory: /workdir/openwrt
        run: |
          for attempt in 1 2 3; do
            if make download -j2; then
              break
            fi
            echo "Download attempt $attempt failed; retrying..."
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
          find dl -size -1024c -type f -print -delete
          test -z "$(find dl -size -1024c -type f -print -quit)"

      - name: 编译固件
        id: compile
        working-directory: /workdir/openwrt
        env:
          REQUESTED_JOBS: ${{ inputs.build_jobs }}
        run: |
          set -o pipefail
          if [ -n "$REQUESTED_JOBS" ]; then
            threads="$REQUESTED_JOBS"
          else
            threads="$(nproc)"
            if [ "$threads" -gt 2 ]; then threads=$((threads - 2)); else threads=1; fi
          fi
          case "$threads" in (*[!0-9]*|0) echo 'Invalid build_jobs'; exit 1;; esac
          echo "Using $threads build threads"
          if ! make -j"$threads" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"; then
            echo 'Parallel build failed; retrying single-threaded. Detailed output is in build.log.'
            make -j1 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          if [ -s DEVICE_NAME ]; then echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"; fi
          echo "FILE_DATE=_$(date +'%Y%m%d%H%M')" >> "$GITHUB_ENV"

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-openwrt-build-log
          path: build.log
          if-no-files-found: ignore

      - name: 整理固件
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

      - name: 上传固件文件
        if: steps.organize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Custom_OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: 发布固件版本
        if: steps.organize.outcome == 'success' && inputs.upload_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom${{ env.FILE_DATE }}
          generate_release_notes: true
          files: ${{ env.FIRMWARE }}/*
