name: 自定义 OpenWrt 固件编译

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: OpenWrt 源码仓库地址
        required: true
        default: https://github.com/immortalwrt/immortalwrt
      repo_branch:
        description: 源码分支
        required: true
        default: openwrt-24.10
      config_file:
        description: 配置文件路径
        required: true
        default: .config
      feeds_file:
        description: 软件源配置文件路径
        required: true
        default: feeds.conf.default
      upload_release:
        description: 是否发布 GitHub Release
        required: true
        type: boolean
        default: true
      build_jobs:
        description: 编译并发数，留空使用逻辑线程数减 2
        required: false
        default: ""
      rootfs_size:
        description: RootFS 分区大小，单位 MiB
        required: true
        default: "5120"

concurrency:
  group: openwrt-shared-self-hosted-runner
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Shanghai

jobs:
  checkout:
    name: 检出仓库配置
    runs-on: self-hosted
    steps:
      - name: 检出仓库配置
        uses: actions/checkout@v5

  prepare:
    name: 准备编译环境
    needs: checkout
    runs-on: self-hosted
    steps:
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gperf help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool make ninja-build p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo unzip vim wget xsltproc zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          mkdir -p ~/workdir

  source:
    name: 获取并更新源码
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: 更新或克隆源码
        env:
          REPO_URL: ${{ inputs.repo_url }}
          REPO_BRANCH: ${{ inputs.repo_branch }}
        run: |
          if [ -d ~/workdir/openwrt/.git ]; then
            cd ~/workdir/openwrt
            git remote set-url origin "$REPO_URL"
            git fetch --depth=1 origin "$REPO_BRANCH"
            git checkout -B "$REPO_BRANCH" "origin/$REPO_BRANCH"
            git reset --hard "origin/$REPO_BRANCH"
            echo '保留 build_dir、staging_dir、dl 等编译缓存，不执行 git clean。'
          elif [ -e ~/workdir/openwrt ]; then
            echo '发现非 Git 的 ~/workdir/openwrt，停止且不删除，避免误删编译缓存。'
            echo '请先人工检查该目录，确认后再处理。'
            exit 1
          else
            git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" ~/workdir/openwrt
          fi

  feeds:
    name: 更新并安装软件源
    needs: source
    runs-on: self-hosted
    steps:
      - name: 执行 diy-part1 并更新 feeds
        env:
          FEEDS_FILE: ${{ inputs.feeds_file }}
        run: |
          test -s "$GITHUB_WORKSPACE/$FEEDS_FILE"
          cp "$GITHUB_WORKSPACE/$FEEDS_FILE" ~/workdir/openwrt/feeds.conf.default
          chmod +x "$GITHUB_WORKSPACE/diy-part1.sh" "$GITHUB_WORKSPACE/diy-part2.sh"
          cd ~/workdir/openwrt
          "$GITHUB_WORKSPACE/diy-part1.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

  config:
    name: 应用系统配置
    needs: feeds
    runs-on: self-hosted
    steps:
      - name: 应用 .config 和 RootFS 大小
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          ROOTFS_SIZE: ${{ inputs.rootfs_size }}
        run: |
          test -s "$GITHUB_WORKSPACE/$CONFIG_FILE"
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" ~/workdir/openwrt/.config
          cd ~/workdir/openwrt
          case "$ROOTFS_SIZE" in (*[!0-9]*|0) echo 'RootFS 大小无效'; exit 1;; esac
          sed -i "s/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_SIZE/" .config
          make defconfig
          "$GITHUB_WORKSPACE/diy-part2.sh"
          grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE_(luci-app-daed|daed))' .config | head -60

  download:
    name: 下载软件包源码
    needs: config
    runs-on: self-hosted
    steps:
      - name: 下载并检查源码
        run: |
          cd ~/workdir/openwrt
          for attempt in 1 2 3; do
            if make download -j2; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "第 $attempt 次下载失败，15 秒后重试"
            sleep 15
          done
          find dl -size -1024c -type f -print -delete
          test -z "$(find dl -size -1024c -type f -print -quit)"

  parallel_compile:
    name: 并行编译固件
    needs: download
    runs-on: self-hosted
    steps:
      - name: 执行并行编译
        env:
          REQUESTED_JOBS: ${{ inputs.build_jobs }}
        run: |
          set -o pipefail
          cd ~/workdir/openwrt
          if [ -n "$REQUESTED_JOBS" ]; then
            threads="$REQUESTED_JOBS"
          else
            threads="$(nproc)"
            if [ "$threads" -gt 2 ]; then threads=$((threads - 2)); else threads=1; fi
          fi
          case "$threads" in (*[!0-9]*|0) echo '编译并发数无效'; exit 1;; esac
          echo "使用 $threads 个编译线程"
          make -j"$threads" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

  single_compile:
    name: 单线程编译固件
    needs: parallel_compile
    if: always() && needs.parallel_compile.result == 'failure'
    runs-on: self-hosted
    steps:
      - name: 执行单线程编译
        run: |
          set -o pipefail
          cd ~/workdir/openwrt
          echo '并行编译失败，开始单线程编译'
          make -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

  organize:
    name: 整理固件
    needs: [parallel_compile, single_compile]
    if: always() && (needs.parallel_compile.result == 'success' || needs.single_compile.result == 'success')
    runs-on: self-hosted
    steps:
      - name: 整理输出目录
        run: |
          set -e
          target_dir=$(ls -d ~/workdir/openwrt/bin/targets/*/* 2>/dev/null | head -1)
          if [ -z "$target_dir" ]; then
            echo '未找到固件输出目录，跳过整理。'
            exit 0
          fi
          cd "$target_dir"
          echo "固件目录: $PWD"
          rm -rf "$GITHUB_WORKSPACE/firmware"
          mkdir -p "$GITHUB_WORKSPACE/firmware"
          cp -a . "$GITHUB_WORKSPACE/firmware/"
          ls -lh "$GITHUB_WORKSPACE/firmware/"

  upload_log:
    name: 上传编译日志
    if: always()
    needs: [parallel_compile, single_compile]
    runs-on: self-hosted
    steps:
      - name: 上传 build.log
        uses: actions/upload-artifact@v5
        with:
          name: custom-openwrt-build-log
          path: build.log
          if-no-files-found: ignore

  upload_firmware:
    name: 上传固件文件
    needs: organize
    runs-on: self-hosted
    steps:
      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Custom_OpenWrt_firmware
          path: firmware

  release:
    name: 发布固件版本
    needs: organize
    if: inputs.upload_release == true
    runs-on: self-hosted
    steps:
      - name: 发布固件到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-${{ github.run_number }}
          generate_release_notes: true
          files: ${{ github.workspace }}/firmware/*
